services:
  # 1. Backend Web Service
  - type: web
    name: aruvi-tours-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123

  # 2. Frontend Static Site
  - type: web
    name: aruvi-tours-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aruvi-tours-backend
          property: host
        path: /api
    routes:
      # Rewrite all requests to index.html for React Router SPA support
      - type: rewrite
        source: /*
        destination: /index.html
